# /etc/nginx/sites-available/rocky  (sites-enabled/rocky 로 링크)
# 공개 HAProxy → 이 nginx :80 → 127.0.0.1:18081 (노트북에서 SSH -R 로 연 포트) → 노트북 port-forward → 클러스터 rocky-api
server {
    listen 80 default_server;
    server_name team3.swpp-2026-b.snu.ac.kr _;

    client_max_body_size 200m;      # 곡 업로드 (서버 제한 ROCKY_MAX_UPLOAD_MB=200)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;    # 큰 업로드를 바로 넘김

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Rocky-Key $http_x_rocky_key;
    }
}
