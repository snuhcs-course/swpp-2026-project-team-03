# Second workspace (gpu22). The ROCKY API: a CPU-only pod that stays up (no GPU, so the 30-minute idle-GPU
# rule does not apply). It runs up to four songs, each with one GPU Pod (unified.py) and then
# one CPU Pod (publish_scores.py). Code is read from /data/server.
#
#   After checking no jobs are active: kubectl replace --force -f server/k8s/ws2/api-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: rocky-api
  labels:
    app: rocky-api
spec:
  # second workspace: its volume rocky-data lives on ford
  nodeSelector:
    kubernetes.io/hostname: ford
  restartPolicy: Always
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rocky-data
  containers:
    - name: api
      image: python:3.12-slim
      command: ["/bin/bash", "-lc"]
      args:
        - >-
          set -euo pipefail;
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null;
          pip install -q --cache-dir /data/cache/pip-api -r /data/server/requirements.txt;
          cd /data/server && exec uvicorn rocky_server.app:app_from_env --factory
          --host 0.0.0.0 --port 8000
      env:
        # The workspace's default service account can create, watch and delete Pods (checked
        # 2026-11-20), so this pod starts the GPU and PDF Pods itself; no laptop agent is needed.
        - name: ROCKY_RUNNER
          value: kubernetes
        # GPU and PDF Pods go to the node that holds this workspace's volume
        - name: ROCKY_NODE
          value: ford
        # the GPU and PDF Pods mount the same volume
        - name: ROCKY_PVC
          value: rocky-data
        # At most four active songs (the workspace's 4-GPU quota); extra jobs stay queued.
        - name: ROCKY_PARALLEL
          value: "4"
        # Per-song work Pods. Four of them plus the API, files and tunnel Pods (4.5 CPU) fit the 16 CPU quota.
        # Sizes measured on gpu05 on 2026-11-23: see deploy/parallel4.md.
        - name: ROCKY_MIDI_CPU
          value: "2"
        - name: ROCKY_MIDI_MEMORY
          value: 8Gi
        - name: ROCKY_MIDI_THREADS
          value: "2"
        - name: ROCKY_PDF_CPU
          value: "2"
        - name: ROCKY_PDF_MEMORY
          value: 8Gi
        # whole songs as WAV are large (a 6-minute WAV is about 60 MB)
        - name: ROCKY_MAX_UPLOAD_MB
          value: "200"
        # exposed publicly through a tunnel: every request except /health needs X-Rocky-Key
        - name: ROCKY_API_KEY
          valueFrom:
            secretKeyRef:
              name: rocky-api-key
              key: ROCKY_API_KEY
      ports:
        - containerPort: 8000
      resources:
        # the workspace has no guaranteed CPU or memory, so requests must be 0
        requests:
          cpu: "0"
          memory: "0"
          ephemeral-storage: "0"
        limits:
          cpu: "2"
          memory: 2Gi
          ephemeral-storage: 10Gi
      volumeMounts:
        - name: data
          mountPath: /data
