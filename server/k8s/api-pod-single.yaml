# gpu05/ferrari fallback: one song worker. The API creates one GPU Pod
# and then one CPU publication Pod per song. Code is read from /data/server.
#
#   After checking no jobs are active: kubectl replace --force -f server/k8s/api-pod-single.yaml
#   kubectl port-forward pod/rocky-api 8000:8000   # for local API access when needed
apiVersion: v1
kind: Pod
metadata:
  name: rocky-api
  labels:
    app: rocky-api
spec:
  # the muscriptor-data volume is a hostpath on ferrari
  nodeSelector:
    kubernetes.io/hostname: ferrari
  restartPolicy: Always
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: muscriptor-data
  containers:
    - name: api
      image: python:3.12-slim
      command: ["/bin/bash", "-lc"]
      args:
        - >-
          set -euo pipefail;
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null;
          pip install -q --cache-dir /data/cache/pip-api -r /data/server/requirements.txt;
          cd /data/server && exec uvicorn rocky_server.app:app_from_env --factory
          --host 0.0.0.0 --port 8000
      env:
        - name: ROCKY_RUNNER
          value: kubernetes
        - name: ROCKY_NODE
          value: ferrari
        - name: ROCKY_PVC
          value: muscriptor-data
        # One active song; extra jobs stay queued.
        - name: ROCKY_PARALLEL
          value: "1"
        # whole songs as WAV are large (a 6-minute WAV is about 60 MB)
        - name: ROCKY_MAX_UPLOAD_MB
          value: "200"
        # No API key: the API is reachable only through kubectl port-forward.
        # If it is ever exposed publicly, set ROCKY_API_KEY from a Secret.
      ports:
        - containerPort: 8000
      resources:
        # the workspace has no guaranteed CPU or memory, so requests must be 0
        requests:
          cpu: "0"
          memory: "0"
          ephemeral-storage: "0"
        limits:
          cpu: "2"
          memory: 2Gi
          ephemeral-storage: 10Gi
      volumeMounts:
        - name: data
          mountPath: /data
