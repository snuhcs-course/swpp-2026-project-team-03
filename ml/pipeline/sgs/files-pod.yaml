# Optional CPU-only transfer pod; use only when rocky-files does not already exist.
apiVersion: v1
kind: Pod
metadata:
  name: rocky-files
spec:
  nodeSelector:
    kubernetes.io/hostname: ferrari
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: muscriptor-data
  containers:
    - name: app
      image: debian:bookworm
      command: ['/bin/bash', '-c', 'sleep inf']
      resources:
        requests:
          cpu: "0"
          memory: "0"
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: data
          mountPath: /data
