# One-GPU pod that runs the pipeline on every file in /data/input and exits,
# which releases the GPU.  The volume lives on one node (hostpath), so the pod
# is scheduled on that node.
apiVersion: v1
kind: Pod
metadata:
  name: rocky-pipeline
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  # with the cluster default (ndots:5) uv fails to resolve github.com, which
  # it needs for downloading Python 3.11
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: muscriptor-data
  containers:
    - name: app
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
      command: ['/bin/bash', '/data/pipeline/sgs/run_all.sh']
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        # the workspace has no guaranteed CPU or memory, so requests must be 0
        requests:
          cpu: "0"
          memory: "0"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: 1
      volumeMounts:
        - name: data
          mountPath: /data
