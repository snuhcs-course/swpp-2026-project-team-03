apiVersion: v1
kind: Pod
metadata:
  name: gpu-shell05
spec:
  nodeSelector:
    kubernetes.io/hostname: ferrari
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: muscriptor-data
  containers:
    - name: app
      image: nvcr.io/nvidia/cuda:12.5.0-base-ubuntu22.04
      command: ['/bin/bash', '-c', 'sleep inf']
      resources:
        requests:
          cpu: "0"
          memory: "0"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: 1
      volumeMounts:
        - name: data
          mountPath: /data
