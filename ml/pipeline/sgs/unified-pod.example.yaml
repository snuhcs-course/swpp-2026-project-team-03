# Example one-song GPU Pod. Edit the input, output and lineup values before use.
# Run only when another GPU Pod is not using the team's quota.
# This stage stops after MIDI/GP5; score-pdf-pod.example.yaml publishes PDFs/MP3s.
apiVersion: v1
kind: Pod
metadata:
  name: rocky-unified-example
spec:
  nodeSelector:
    kubernetes.io/hostname: ferrari
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: muscriptor-data
  containers:
    - name: pipeline
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
      command: ['/bin/bash', '-lc']
      args:
        - |
          set -euo pipefail
          export HF_HOME=/data/cache/hf TORCH_HOME=/data/cache/torch
          export UV_CACHE_DIR=/data/cache/uv UV_TOOL_DIR=/data/cache/uv-tools
          export UV_PYTHON_INSTALL_DIR=/data/cache/python XDG_CACHE_HOME=/data/cache/xdg
          exec /data/rocky-unified/.venv/bin/python /data/pipeline/unified.py \
            "$ROCKY_INPUT_AUDIO" "$ROCKY_OUTPUT_DIR" \
            --original "$ROCKY_ORIGINAL" --requested "$ROCKY_REQUESTED" \
            --bsroformer-models-dir /data/bsrofo/models \
            --bsroformer-lib-dir /data/bsrofo/pylib \
            --resume --no-publish
      env:
        - name: ROCKY_INPUT_AUDIO
          value: /data/input/song.wav
        - name: ROCKY_OUTPUT_DIR
          value: /data/output_unified/song
        - name: ROCKY_ORIGINAL
          value: unknown
        - name: ROCKY_REQUESTED
          value: keyboard,bass,guitar1,drums
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        requests:
          cpu: "0"
          memory: "0"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: 1
      volumeMounts:
        - name: data
          mountPath: /data
