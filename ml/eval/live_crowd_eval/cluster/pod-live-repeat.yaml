# 같은 원본을 한 번 더 돌려(A2) 파이프라인 실행 간 흔들림을 재는 Pod. 만들자마자 run_repeat.sh가 실행됨.
# 끝나면 지우기: k22 delete pod rocky-live-repeat
apiVersion: v1
kind: Pod
metadata:
  name: rocky-live-repeat
spec:
  nodeSelector:
    kubernetes.io/hostname: ford
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rocky-data
  containers:
    - name: app
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
      command: ["/bin/bash", "-c", "bash /data/live_eval/run_repeat.sh 2>&1 | tee -a /data/live_eval/repeat.log"]
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        requests:
          cpu: "0"
          memory: "0"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: 1
      volumeMounts:
        - name: data
          mountPath: /data
