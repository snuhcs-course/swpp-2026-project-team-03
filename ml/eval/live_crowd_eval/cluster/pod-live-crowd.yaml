# crowd 분리만 하는 두 번째 GPU Pod. 본 실험 Pod와 동시에 돌리려고 cpu 4·메모리 16Gi (CPU 할당량 16 안).
# 끝나면 지우기: k22 delete pod rocky-live-crowd
apiVersion: v1
kind: Pod
metadata:
  name: rocky-live-crowd
spec:
  nodeSelector:
    kubernetes.io/hostname: ford
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  dnsConfig:
    options:
      - name: ndots
        value: "1"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rocky-data
  containers:
    - name: app
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
      command: ["/bin/bash", "-c", "bash /data/live_eval/run_crowd.sh 2>&1 | tee -a /data/live_eval/crowd.log"]
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
      resources:
        requests:
          cpu: "0"
          memory: "0"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: 1
      volumeMounts:
        - name: data
          mountPath: /data
